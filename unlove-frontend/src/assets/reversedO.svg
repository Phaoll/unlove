O with Inverted Heart Center
Image 
I've created an SVG with an "O" shape that has an inverted (upside-down) heart as its center. The design uses:

A circle with a thick stroke to create the "O" shape
An SVG mask to cut out the inverted heart shape from the center
The heart is rotated 180 degrees to appear inverted
I've added a faint red outline of the heart to show its shape more clearly
The inverted heart points upward instead of the traditional downward point. Would you like me to adjust the size of the heart, change the colors, or modify the design in any other way?




