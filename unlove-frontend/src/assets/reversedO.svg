perfect ! thanks

You're welcome! I'm glad the rotated O with the inverted heart-shaped center turned out exactly as you wanted. The upside-down heart creates a nice visual effect. Feel free to ask if you need any other SVG designs or modifi





<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define the heart-shaped center -->
  <defs>
    <path id="heartCenter" d="
      M 100 75
      C 100 75, 85 60, 70 60
      C 55 60, 45 70, 45 85
      C 45 100, 75 130, 100 155
      C 125 130, 155 100, 155 85
      C 155 70, 145 60, 130 60
      C 115 60, 100 75, 100 75
      Z
    "/>
  </defs>
  
  <!-- Create the O shape with heart-shaped hollow center -->
  <g transform="rotate(180 100 100)">
    <path d="
    M 100 20
    A 80 80 0 1 1 100 180
    A 80 80 0 1 1 100 20
    Z
    M 100 75
    C 100 75, 85 60, 70 60
    C 55 60, 45 70, 45 85
    C 45 100, 75 130, 100 155
    C 125 130, 155 100, 155 85
    C 155 70, 145 60, 130 60
    C 115 60, 100 75, 100 75
    Z
  " fill="black" fill-rule="evenodd"/>
  </g>
</svg>
